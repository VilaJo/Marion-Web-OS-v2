    <!-- FOUC: Professionnel studio (Stability) = thème principal -->
    <script>
      (function () {
        try {
          var studio = localStorage.getItem('marion_theme_studio_v1');
          if (!studio) {
            localStorage.setItem('marion_theme_studio_v1', '1');
            localStorage.setItem('marion_theme', 'light');
            var acc = localStorage.getItem('marion_accent');
            if (!acc || acc === 'orange' || acc === '#FF7E5F' || acc === '#7C9A7E') {
              localStorage.setItem('marion_accent', '#b05070');
            }
          }
          var t = localStorage.getItem('marion_theme') || 'light';
          var root = document.documentElement;
          root.classList.remove('dark', 'unicorn');
          if (t === 'dark') root.classList.add('dark');
          else if (t === 'unicorn') root.classList.add('unicorn');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute(
              'content',
              t === 'dark' ? '#0d1329' : t === 'unicorn' ? '#fdf4ff' : '#F4F5F7'
            );
          }
        } catch (e) {
          /* keep default Professionnel studio tokens from :root */
        }
      })();
    </script>

    <style>
      body {
        font-family: 'Archivo', system-ui, sans-serif;
        font-weight: 400;
        overflow-x: hidden;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Archivo', system-ui, sans-serif;
        font-weight: 600;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }
      .glass {
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(228, 230, 234, 0.95);
        box-shadow: 0 1px 2px rgba(15, 16, 20, 0.04);
      }
      .dark .glass {
        background: rgba(21, 21, 22, 0.92); /* Linear surface */
        border: 1px solid #262626;
        box-shadow: none;
      }

      /* Unicorn Mode specific glass override */
      .unicorn .glass {
        background: rgba(255, 255, 255, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 8px 32px 0 rgba(236, 72, 153, 0.15);
      }
      
      /* Juicy Hover */
      .juicy-hover {
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      .juicy-hover:hover {
        transform: translateY(-4px) scale(1.02);
      }
      
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-15px); }
      }
      @keyframes float-reverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(15px); }
      }
      @keyframes float-slow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(5deg); }
      }

      @keyframes loading {
        0% { width: 0%; }
        50% { width: 70%; }
        100% { width: 100%; }
      }

      @keyframes twinkle {
          0%, 100% { opacity: 0.3; }
          50% { opacity: 1; }
      }

      @keyframes shooting-star {
        0% { transform: translateX(0) translateY(0) rotate(-45deg); opacity: 0; }
        10% { opacity: 1; }
        20% { opacity: 0; }
        100% { transform: translateX(-400px) translateY(400px) rotate(-45deg); opacity: 0; }
      }

      /* --- Unicorn Animations --- */
      
      /* Lively Idle: Breathing + Looking around */
      @keyframes unicorn-idle-lively {
        0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
        25% { transform: translateY(-3px) rotate(-2deg) scale(1.02); } /* Look left/up slightly */
        50% { transform: translateY(0) rotate(0deg) scale(1); }
        75% { transform: translateY(-2px) rotate(2deg) scale(1.01); } /* Look right slightly */
      }

      /* Fireflies Animation Group */
      @keyframes fireflies-group-move {
        0% { opacity: 0; transform: translate(0, 0); }
        10% { opacity: 1; transform: translate(-10px, -5px); }
        30% { transform: translate(-50px, 5px); }
        50% { transform: translate(-90px, -15px); }
        70% { transform: translate(-130px, 0px); }
        90% { opacity: 1; transform: translate(-170px, -20px); }
        100% { opacity: 0; transform: translate(-190px, -30px); }
      }

      /* Chaotic dances for individual fireflies */
      @keyframes firefly-dance-1 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        25% { transform: translate(8px, -8px) scale(1.2); }
        50% { transform: translate(0, -15px) scale(0.8); }
        75% { transform: translate(-8px, -5px) scale(1.1); }
      }

      @keyframes firefly-dance-2 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(-10px, 5px) scale(0.9); }
        66% { transform: translate(5px, 10px) scale(1.2); }
      }

      @keyframes firefly-dance-3 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(12px, 0px) scale(1.3); }
      }

      @keyframes unicorn-run-left {
        0% { transform: translateX(0) rotate(0deg); }
        10% { transform: translateX(5px) rotate(5deg); } /* Recul pour élan */
        30% { transform: translateX(-30px) rotate(-10deg); } /* Bond en avant gauche */
        50% { transform: translateX(-70px) rotate(-5deg); } /* Course */
        60% { transform: translateX(-80px) rotate(0deg); } /* Pause brève */
        100% { transform: translateX(0) rotate(0deg); } /* Retour */
      }

      /* Love Interaction */
      @keyframes unicorn-love-jump {
        0%, 100% { transform: scale(1) translateY(0); }
        50% { transform: scale(1.1) translateY(-10px) rotate(-5deg); }
      }

      @keyframes float-heart {
        0% { transform: translateY(0) scale(0.5); opacity: 0; }
        20% { opacity: 1; transform: translateY(-20px) scale(1); }
        100% { transform: translateY(-60px) scale(0); opacity: 0; }
      }

      @keyframes rainbow-slide {
        0% { transform: translateY(0) scale(1); }
        100% { transform: translateY(-20px) scale(1.05); }
      }

      @keyframes shimmer {
        0% { transform: translateX(-150%); }
        50% { transform: translateX(150%); }
        100% { transform: translateX(150%); }
      }

      @keyframes shimmer {
        0% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      
      .animate-shimmer {
        animation: shimmer 3s linear infinite;
      }
      
      .bg-300\% {
        background-size: 300% 100%;
      }

      /* Space Objects */
      .planet-lollipop {
          background: linear-gradient(135deg, #b05070, #4a72c4);
          box-shadow: inset -10px -10px 20px rgba(0,0,0,0.2), 0 0 30px rgba(74, 114, 196, 0.4);
      }
      
      .planet-ring {
        position: absolute;
        width: 160%;
        height: 40%;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top: 2px solid rgba(255, 255, 255, 0.8);
        border-radius: 50%;
        top: 50%;
        left: -30%;
        transform: translateY(-50%) rotate(-20deg);
      }

      .planet-peach {
          background: linear-gradient(to bottom, #A7C1A3, #2aada0);
          box-shadow: inset -5px -5px 10px rgba(0,0,0,0.1), 0 0 20px rgba(42, 173, 160, 0.3);
      }

      .planet-blue {
          background: linear-gradient(45deg, #6a8fd0, #4a72c4);
          box-shadow: 0 0 15px rgba(74, 114, 196, 0.4);
      }
      
      .crater {
        position: absolute;
        border-radius: 50%;
        background: rgba(0,0,0,0.1);
        box-shadow: inset 1px 1px 2px rgba(0,0,0,0.2);
      }

      .shooting-star {
        position: absolute;
        width: 150px;
        height: 2px;
        background: linear-gradient(to right, rgba(255,255,255,0), rgba(74, 114, 196, 1), rgba(255,255,255,0));
        z-index: -1;
        border-radius: 100%;
      }

      /* Star Layers - Static in Dark Mode */
      .star-bg {
          position: absolute;
          width: 100%;
          height: 100%;
          top: 0;
          left: 0;
      }
      
      .stars-sm {
          background-image: radial-gradient(1px 1px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                            radial-gradient(1px 1px at 40px 70px, #ffffff, rgba(0,0,0,0)),
                            radial-gradient(1px 1px at 50px 160px, #ffffff, rgba(0,0,0,0)),
                            radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                            radial-gradient(1px 1px at 130px 80px, #ffffff, rgba(0,0,0,0));
          background-repeat: repeat;
          background-size: 200px 200px;
          opacity: 0.5;
      }
      
      .stars-md {
          background-image: radial-gradient(2px 2px at 100px 50px, #e9d5ff, rgba(0,0,0,0)),
                            radial-gradient(2px 2px at 200px 150px, #ffedd5, rgba(0,0,0,0)),
                            radial-gradient(2px 2px at 300px 100px, #ffffff, rgba(0,0,0,0));
          background-repeat: repeat;
          background-size: 300px 300px;
          background-position: fixed;
          opacity: 0.8;
          animation: twinkle 5s infinite alternate;
      }

      .stars-lg {
          background-image: radial-gradient(3px 3px at 50px 100px, #ffffff, rgba(0,0,0,0)),
                            radial-gradient(3px 3px at 150px 200px, #fce7f3, rgba(0,0,0,0));
          background-repeat: repeat;
          background-size: 400px 400px;
          background-position: fixed;
          opacity: 1;
          animation: twinkle 7s infinite alternate-reverse;
      }

      /* Unicorn World Elements - 3D CSS Objects */
      .cloud-3d {
          background: #fff;
          width: 150px; height: 50px;
          border-radius: 50px;
          box-shadow: inset -5px -5px 10px rgba(0,0,0,0.05), 0 10px 20px rgba(0,0,0,0.05);
          position: absolute;
      }
      .cloud-3d::after {
          content: ''; position: absolute;
          width: 60px; height: 60px;
          background: #fff;
          border-radius: 50%;
          top: -30px; left: 20px;
          box-shadow: inset 2px 2px 5px rgba(255,255,255,1);
      }
      .cloud-3d::before {
          content: ''; position: absolute;
          width: 80px; height: 80px;
          background: #fff;
          border-radius: 50%;
          top: -50px; right: 20px;
          box-shadow: inset 2px 2px 5px rgba(255,255,255,1);
      }

      .sun-3d-sphere {
          background: radial-gradient(circle at 35% 35%, #fefce8, #facc15);
          border-radius: 50%;
          box-shadow: inset -10px -10px 30px rgba(202, 138, 4, 0.2), 0 0 60px rgba(250, 204, 21, 0.6);
      }

      .rainbow-ring {
          position: absolute;
          border-radius: 50%;
          border: 40px solid transparent;
          filter: blur(8px);
          opacity: 0.5;
          width: 120%; height: 120%;
          left: -10%; bottom: -40%;
      }

      /* --- Briefing Content Styles --- */
      .briefing-content {
        font-family: 'Archivo', system-ui, sans-serif;
        font-weight: 400;
      }
      
      .briefing-content h3 {
        font-family: 'Archivo', system-ui, sans-serif;
        font-weight: 600;
        background: linear-gradient(120deg, #b05070 0%, #4a72c4 55%, #2aada0 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-size: 1.8rem;
        margin-top: 2rem;
        margin-bottom: 1rem;
        letter-spacing: -0.02em;
      }
      .dark .briefing-content h3 {
        background: linear-gradient(120deg, #c56986 0%, #6a8fd6 55%, #45c2b5 100%);
        -webkit-background-clip: text;
      }
      
      .briefing-content ul {
        list-style-type: none;
        padding-left: 0;
        margin-bottom: 2rem;
        background: rgba(255,255,255,0.5);
        border-radius: 1rem;
        padding: 1.5rem;
        border: 1px solid rgba(0,0,0,0.05);
      }
      .dark .briefing-content ul {
        background: rgba(255,255,255,0.05);
        border-color: rgba(255,255,255,0.1);
      }
      
      .briefing-content li {
        position: relative;
        padding-left: 1.5rem;
        margin-bottom: 0.75rem;
        color: #475569;
        font-size: 1rem;
        line-height: 1.6;
      }
      .dark .briefing-content li {
        color: #e2e8f0;
      }
      
      /* Fancy Bullet */
      .briefing-content li::before {
        content: '✦';
        color: var(--brand-color);
        font-size: 1rem;
        position: absolute;
        left: 0;
        top: 0.1rem;
      }
      
      .briefing-content p {
        margin-bottom: 1.5rem;
        line-height: 1.7;
        color: #334155;
        font-size: 1.05rem;
      }
      .dark .briefing-content p {
        color: #cbd5e1;
      }
      
      .briefing-content strong {
        color: var(--brand-color);
        font-weight: 700;
      }

      /* --- SPACE THEME (Dark Mode) VIDEO GAME BUTTONS --- */
      
      /* General Button Transition */
      .dark button {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Primary / Gradient Buttons (The "Action" Buttons) */
      .dark button[class*="bg-gradient"], 
      .dark button[class*="bg-brand-orange"],
      .dark button[class*="from-brand-orange"] {
        box-shadow: 0 0 10px rgba(124, 154, 126, 0.35), 
                    inset 0 0 10px rgba(255, 255, 255, 0.12),
                    0 0 0 1px rgba(124, 154, 126, 0.25); /* Thin sage border */
        text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        backdrop-filter: blur(4px);
      }

      .dark button[class*="bg-gradient"]:hover,
