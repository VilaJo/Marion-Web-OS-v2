<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eonora Tech OS - Hors ligne</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Raleway:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Raleway', sans-serif;
            background: linear-gradient(135deg, #FFE4D6 0%, #FFF8F5 50%, #FFF0F5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 48px 32px;
            box-shadow: 0 20px 60px rgba(255, 126, 95, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #FF7E5F 0%, #FEB47B 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 10px 30px rgba(255, 126, 95, 0.4);
        }
        
        .logo span {
            font-family: 'Georgia', serif;
            font-size: 36px;
            color: white;
            font-style: italic;
        }
        
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 24px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 12px;
        }
        
        .subtitle {
            color: #64748b;
            font-size: 16px;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        
        .offline-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 24px;
            position: relative;
        }
        
        .wifi-icon {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: #cbd5e1;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        
        .wifi-cross {
            stroke: #f87171;
            stroke-width: 3;
        }
        
        .retry-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            background: linear-gradient(135deg, #FF7E5F 0%, #FEB47B 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 126, 95, 0.4);
        }
        
        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 126, 95, 0.5);
        }
        
        .retry-btn:active {
            transform: translateY(0);
        }
        
        .retry-btn svg {
            width: 18px;
            height: 18px;
        }
        
        .tips {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #e2e8f0;
            text-align: left;
        }
        
        .tips h3 {
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 12px;
        }
        
        .tips ul {
            list-style: none;
            color: #64748b;
            font-size: 13px;
        }
        
        .tips li {
            padding: 6px 0;
            padding-left: 20px;
            position: relative;
        }
        
        .tips li::before {
            content: '•';
            color: #FF7E5F;
            position: absolute;
            left: 0;
            font-weight: bold;
        }
        
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(to bottom, #2E1065, #0F172A);
            }
            
            .container {
                background: rgba(30, 41, 59, 0.9);
                border-color: rgba(255, 255, 255, 0.1);
            }
            
            h1 {
                color: #f1f5f9;
            }
            
            .subtitle {
                color: #94a3b8;
            }
            
            .tips {
                border-color: #334155;
            }
            
            .tips h3 {
                color: #cbd5e1;
            }
            
            .tips ul {
                color: #94a3b8;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <span>M</span>
        </div>
        
        <div class="offline-icon">
            <svg class="wifi-icon" viewBox="0 0 24 24">
                <path d="M5 12.55a11 11 0 0 1 14.08 0" />
                <path d="M1.42 9a16 16 0 0 1 21.16 0" />
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
                <circle cx="12" cy="20" r="1" fill="currentColor" />
                <line class="wifi-cross" x1="2" y1="2" x2="22" y2="22" />
            </svg>
        </div>
        
        <h1>Vous êtes hors ligne</h1>
        <p class="subtitle">
            Impossible de se connecter au serveur. Vérifiez votre connexion internet et réessayez.
        </p>
        
        <button class="retry-btn" onclick="window.location.reload()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 2v6h-6" />
                <path d="M3 12a9 9 0 0 1 15-6.7L21 8" />
                <path d="M3 22v-6h6" />
                <path d="M21 12a9 9 0 0 1-15 6.7L3 16" />
            </svg>
            Réessayer
        </button>
        
        <div class="tips">
            <h3>Conseils</h3>
            <ul>
                <li>Vérifiez que le Wi-Fi ou les données mobiles sont activés</li>
                <li>Essayez de vous rapprocher du routeur</li>
                <li>Redémarrez l'application si le problème persiste</li>
            </ul>
        </div>
    </div>
</body>
</html>
