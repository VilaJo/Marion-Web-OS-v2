# Marion Web OS - Continuous Integration
# Runs on every push and pull request to main
#
# Pipeline:
#   1. Backend tests (pytest)
#   2. Frontend tests (vitest) + TypeScript check + build

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # Backend Tests (Python)
  # ============================================================
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short
        env:
          FLASK_ENV: testing
          ENV: testing

  # ============================================================
  # Frontend Tests & Build (Node.js)
  # ============================================================
  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run Vitest
        run: npx vitest run tests/frontend/

      - name: Build frontend
        run: npm run build

  # ============================================================
  # Docker Build (verify Dockerfile is valid)
  # ============================================================
  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: marion-web-os:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
